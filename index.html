<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flōra — Цветочная студия</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #f8f9fa);
      color: var(--tg-theme-text-color, #212529);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .tg-card {
      background-color: var(--tg-theme-secondary-bg-color, #ffffff);
    }
    .tg-button {
      background-color: var(--tg-theme-button-color, #43a047);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
  </style>
</head>
<body class="p-3 pb-24">
  <header class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Студия Flōra</h1>
      <p class="text-xs text-gray-500">Доставка свежих цветов от 60 минут</p>
    </div>
    <div id="cart-indicator" class="relative cursor-pointer p-2 rounded-full tg-card shadow-sm" onclick="toggleCartModal()">
      🛒 <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
    </div>
  </header>

  <div id="product-grid" class="grid grid-cols-2 gap-3"></div>

  <div id="checkout-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end hidden">
    <div class="tg-card w-full rounded-t-2xl p-4 max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold">Оформление заказа</h2>
        <button onclick="toggleCartModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>

      <div id="cart-items-list" class="space-y-2 text-sm"></div>

      <div class="border-t pt-2 space-y-3">
        <input id="recipient_name" type="text" placeholder="Имя получателя" class="w-full p-2.5 rounded-lg border text-sm outline-none text-black">
        <input id="recipient_phone" type="tel" placeholder="Телефон для связи (+7...)" class="w-full p-2.5 rounded-lg border text-sm outline-none text-black">
        <input id="delivery_address" type="text" placeholder="Адрес (Улица, дом, кв.)" class="w-full p-2.5 rounded-lg border text-sm outline-none text-black">
        
        <select id="delivery_time" class="w-full p-2.5 rounded-lg border text-sm outline-none text-black">
          <option value="Как можно скорее (60-90 мин)">⚡ Как можно скорее (60-90 мин)</option>
          <option value="12:00 - 14:00">12:00 - 14:00</option>
          <option value="14:00 - 16:00">14:00 - 16:00</option>
          <option value="16:00 - 18:00">16:00 - 18:00</option>
          <option value="18:00 - 20:00">18:00 - 20:00</option>
        </select>

        <textarea id="postcard_text" rows="2" placeholder="Текст бесплатной открытки (по желанию)" class="w-full p-2.5 rounded-lg border text-sm outline-none text-black"></textarea>
      </div>

      <div class="flex justify-between items-center pt-2 font-bold text-base">
        <span>Итого:</span>
        <span id="final-total">0 ₽</span>
      </div>

      <button id="submit-order-btn" onclick="submitOrder()" class="w-full tg-button py-3.5 rounded-xl font-bold text-center">
        Оформить заказ
      </button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
